name: Unit Tests

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: unittests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit Tests on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            # These versions are real: python-version is passed to
            # setup-miniconda and asserted by the "Verify interpreter" step.
            # Floor is 3.10 -- the `test` extra needs pytest >= 9.0.3 and
            # parsl >= 2026.01.05, which both require 3.10+. Older interpreters
            # run in the core-tests job below. Each version appears once; the
            # full install set resolves on all three OSes for 3.10-3.14.
            include:
              - os: macos-latest
                python-version: '3.11'
              - os: macos-latest
                python-version: '3.14'
              - os: ubuntu-latest
                python-version: '3.12'
              - os: windows-latest
                python-version: '3.10'
              - os: windows-latest
                python-version: '3.13'
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          auto-activate-base: false
          conda-remove-defaults: true

      # Guards the failure mode this matrix used to have: the job name claimed a
      # Python version while every job actually ran the conda base interpreter.
      # Steps that touch Python must use a profile-loading shell (bash -el / pwsh)
      # or they will see base rather than the activated env.
      - name: Verify interpreter matches the matrix (Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: |
          python -c "import sys; got='.'.join(map(str,sys.version_info[:2])); want='${{ matrix.python-version }}'; assert got==want, 'matrix says %s but interpreter is %s'%(want,got); print(sys.version)"

      - name: Verify interpreter matches the matrix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import sys; got='.'.join(map(str,sys.version_info[:2])); want='${{ matrix.python-version }}'; assert got==want, 'matrix says %s but interpreter is %s'%(want,got); print(sys.version)"

      # -----------------------------------------------------------
      # Clean old coverage files
      # -----------------------------------------------------------
      - name: Remove old coverage data (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -f .coverage* coverage.json || true

      - name: Remove old coverage data (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Path .coverage* -Force -ErrorAction SilentlyContinue -Confirm:$false
          Remove-Item -Path coverage.json -Force -ErrorAction SilentlyContinue -Confirm:$false

      - name: Add 12GB swap (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          echo "=== Existing swap devices ==="
          swapon --show || true

          current_swap_mb=$(free -m | awk '/^Swap:/ {print $2}')
          if [ "${current_swap_mb:-0}" -ge 12000 ]; then
            echo "Sufficient swap already present (${current_swap_mb} MB). Skipping swap creation."
            free -h
            exit 0
          fi

          SWAPFILE=/tmp/qmcsoftware_swapfile

          if [ -f "$SWAPFILE" ]; then
            sudo swapoff "$SWAPFILE" || true
            sudo rm -f "$SWAPFILE"
          fi

          sudo fallocate -l 12G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          echo "=== Swap after setup ==="
          swapon --show
          free -h

      - name: Add 12GB swap (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo mkfile 12g /private/var/vm/tempswapfile
          sudo chmod 600 /private/var/vm/tempswapfile

      - name: Configure pagefile (Windows) via CIM (12GB)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $drive    = "D:"
          $initialMB = 12288
          $maxMB     = 12288
          $pagefile  = "$drive\pagefile.sys"
          Write-Host "Configuring pagefile: $pagefile (Initial=${initialMB}MB, Max=${maxMB}MB)"
          $cs = Get-CimInstance Win32_ComputerSystem
          if ($cs.AutomaticManagedPagefile) {
            Set-CimInstance -InputObject $cs -Property @{ AutomaticManagedPagefile = $false } | Out-Null
          }
          $escaped = $pagefile.Replace('\','\\')
          $pfs = Get-CimInstance Win32_PageFileSetting -Filter "Name='$escaped'" -ErrorAction SilentlyContinue
          if ($null -eq $pfs) {
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{
              Name        = $pagefile
              InitialSize = $initialMB
              MaximumSize = $maxMB
            } | Out-Null
          } else {
            Set-CimInstance -InputObject $pfs -Property @{
              InitialSize = $initialMB
              MaximumSize = $maxMB
            } | Out-Null
          }
          "=== Pagefile settings ==="
          Get-CimInstance Win32_PageFileSetting | Format-Table Name,InitialSize,MaximumSize -Auto

      - name: Free space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          conda clean --all --yes
          pip cache purge || true
          df -h

      - name: Free space (macOS)
        if: runner.os == 'macOS'
        run: |
          conda clean --all --yes
          pip cache purge || true
          df -h

      - name: Free space (Windows)
        if: runner.os == 'Windows'
        run: |
          conda clean --all --yes || true
          pip cache purge || true
          Get-Volume | Select-Object DriveLetter, Size, SizeRemaining | Format-Table

      - name: Show runner resources
        if: runner.os != 'Windows'
        run: |
          echo "CPUs: $(nproc || sysctl -n hw.ncpu)"
          free -h || vm_stat
          df -h

      - name: Show runner resources
        if: runner.os == 'Windows'
        run: |
          Get-WmiObject Win32_PageFileUsage | Select-Object Name, AllocatedBaseSize
          Get-ComputerInfo -Property CsTotalPhysicalMemory

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pip/wheels
            ~/Library/Caches/pip
            ~/Library/Caches/pip/wheels
            ~\AppData\Local\pip\Cache
            ~\AppData\Local\pip\Cache\wheels
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache wheel files
        uses: actions/cache@v4
        with:
          path: ./.wheels
          key: ${{ runner.os }}-wheels-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-wheels-

      - name: Build and cache wheels (Linux)
        if: runner.os == 'Linux'
        shell: bash -el {0}
        run: |
          python -m pip wheel -w ./.wheels ".[test,test_torch,test_gpytorch,test_botorch,test_umbridge]" || true

      - name: Install Python dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash -el {0}
        run: |
          pip install --find-links ./.wheels -e ".[test,test_torch,test_gpytorch,test_botorch,test_umbridge]"

      - name: Build and cache wheels (macOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          python -m pip wheel -w ./.wheels ".[test,test_torch,test_gpytorch,test_botorch]" || true

      - name: Install Python dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash -el {0}
        run: |
          pip install --find-links ./.wheels -e ".[test,test_torch,test_gpytorch,test_botorch]"

      - name: Build and cache wheels (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip wheel -w ./.wheels .[test,test_torch,test_gpytorch,test_botorch] || Write-Host 'wheel build step completed'

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install --find-links ./.wheels -e '.[test,test_torch,test_gpytorch,test_botorch]'

      # -----------------------------------------------------------
      # Run unittests for Python source files
      # -----------------------------------------------------------
      - name: Run unittests (parallel, Unix)
        if: runner.os != 'Windows'
        shell: bash -el {0}
        run: make unittests

      - name: Run unittests (parallel, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: make unittests

  # Interpreters below the `test` extra's 3.10 floor. `unittests_core` runs
  # test/test_*.py against the slim `test_core` extra; modules needing an
  # optional stack skip themselves via pytest.importorskip.
  # `strict: false` versions are probes -- qmcpy's source is 3.6-clean but
  # `qmctoolscl` fails to build below 3.9, so they warn instead of failing.
  # This measures the real floor each run: if qmctoolscl starts building on
  # 3.8, that job goes green and can be promoted to strict.
  core-tests:
    name: Core Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false
        matrix:
            include:
              - python-version: '3.6'
                strict: false
              - python-version: '3.7'
                strict: false
              - python-version: '3.8'
                strict: false
              - python-version: '3.9'
                strict: true
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          auto-activate-base: false
          activate-environment: qmcpy-core
          conda-remove-defaults: true

      - name: Report interpreter
        shell: bash -el {0}
        run: python -VV

      - name: Install qmcpy and minimal test dependencies
        id: install
        shell: bash -el {0}
        continue-on-error: ${{ !matrix.strict }}
        run: pip install -e ".[test_core]"

      - name: Run core unit tests
        if: steps.install.outcome == 'success'
        shell: bash -el {0}
        run: make unittests_core

      - name: Report interpreter below the installable floor
        if: steps.install.outcome != 'success'
        shell: bash -el {0}
        run: |
          echo "::warning title=Python ${{ matrix.python-version }} not installable::\
          qmcpy could not be installed on Python ${{ matrix.python-version }}. \
          The qmcpy source itself is 3.6-clean; the blocker is a dependency -- \
          qmctoolscl fails to build on 3.8 and below, and on 3.6 the test_core \
          pins (scikit-learn, pandas) do not resolve either. See the install log \
          above and 'Minimum Python Version by Role' in CONTRIBUTING.md."

  # Early-warning job for the next Python. 3.15.0-rc.1 is published in
  # actions/python-versions but NOT in conda-forge, so this uses setup-python
  # rather than setup-miniconda like the jobs above.
  #
  # Non-blocking by design: at time of writing scipy (a core dependency) and
  # scikit-learn publish no cp315 wheels, so the install is expected to fail
  # until the scientific stack catches up. The job exists to tell us the day
  # that changes -- when it goes green, promote 3.15 into the `tests` matrix.
  prerelease-tests:
    name: Core Unit Tests (Python ${{ matrix.python-version }}, pre-release)
    runs-on: ubuntu-latest
    # Never gate a merge on an unreleased interpreter.
    continue-on-error: true
    strategy:
        fail-fast: false
        matrix:
            python-version: ['3.15.0-rc.1']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Report interpreter
        run: python -VV

      # Step-level continue-on-error is still needed: without it a failed
      # install would skip the reporting step below.
      - name: Install qmcpy and minimal test dependencies
        id: install
        continue-on-error: true
        run: pip install -e ".[test_core]"

      - name: Run core unit tests
        if: steps.install.outcome == 'success'
        run: make unittests_core

      - name: Report pre-release ecosystem not ready
        if: steps.install.outcome != 'success'
        run: |
          echo "::warning title=Python ${{ matrix.python-version }} not installable::\
          qmcpy could not be installed on Python ${{ matrix.python-version }}. \
          This is expected while the scientific stack lacks cp315 wheels (scipy \
          and scikit-learn in particular). See the install log above; when this \
          job passes, promote 3.15 into the tests matrix."
